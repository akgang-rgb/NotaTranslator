<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy - Not a Translator</title>
<style>
  :root { --brand: hsl(283, 58%, 50%); --brand-dark: hsl(283, 58%, 38%); --ink: #1c1424; --muted: #55505c; --bg: #faf7fc; --card: #ffffff; --border: #ece6f2; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f3eef8; --muted:#b3a9bd; --bg:#17121c; --card:#211a29; --border:#33293d; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; padding: 32px 20px; display: flex; justify-content: center; }
  .wrap { max-width: 760px; width: 100%; }
  .langbar { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin:0 0 18px; color:var(--muted); font-size:13px; flex-wrap:wrap; }
  .langbar a { color:var(--brand-dark); text-decoration:none; padding:2px 4px; border-radius:4px; }
  .langbar a[aria-current="true"] { background:var(--border); font-weight:700; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  h2 { font-size: 17px; margin: 28px 0 8px; color: var(--brand-dark); }
  p, li { font-size: 14.5px; color: var(--ink); }
  ul { padding-left: 22px; } li { margin: 4px 0; } a { color: var(--brand-dark); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; }
  .tldr { border-left: 3px solid var(--brand); background: rgba(160,54,201,.06); padding: 12px 16px; border-radius: 8px; margin: 16px 0 24px; font-size: 14px; }
  code { background: var(--border); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body data-policy="experiment" data-default-lang="EN">
<div class="wrap">
  <nav class="langbar" id="langbar" aria-label="Language"></nav>
  <h1 id="policyTitle">Privacy Policy</h1>
  <p class="updated" id="policyUpdated"></p>
  <div class="tldr" id="policyTldr"></div>
  <div class="card" id="policyBody"></div>
  <footer id="policyFooter"></footer>
</div>
<script>
(function () {
  var supported = ['EN', 'FR', 'DE', 'FI', 'ES'];
  var names = { EN:'English', FR:'Français', DE:'Deutsch', FI:'Suomi', ES:'Español' };
  var params = new URLSearchParams(location.search);
  var requested = String(params.get('lang') || localStorage.getItem('notatrSiteLang') || localStorage.getItem('notatrPolicyLang') || navigator.language || '').slice(0, 2).toUpperCase();
  var fallback = document.body.dataset.defaultLang || 'EN';
  var lang = supported.indexOf(requested) >= 0 ? requested : fallback;
  var policyKey = document.body.dataset.policy || 'experiment';
  function el(tag, html) { var n = document.createElement(tag); if (html !== undefined) n.innerHTML = html; return n; }
  function render(data) {
    var page = data.pages[policyKey] || data.pages.experiment || data.pages.nat;
    document.documentElement.lang = data.code || lang.toLowerCase();
    document.title = page.htmlTitle || data.policy;
    document.getElementById('policyTitle').textContent = data.policy;
    document.getElementById('policyUpdated').innerHTML = (page.product || '') + ' · ' + data.updated;
    document.getElementById('policyTldr').innerHTML = page.tldr || '';
    var body = document.getElementById('policyBody'); body.textContent = '';
    (page.sections || []).forEach(function (section) {
      body.appendChild(el('h2', section.h));
      (section.b || []).forEach(function (block) {
        if (block.p) body.appendChild(el('p', block.p));
        if (block.list) { var ul = el('ul'); block.list.forEach(function (item) { ul.appendChild(el('li', item)); }); body.appendChild(ul); }
      });
    });
    document.getElementById('policyFooter').innerHTML = page.footer || '';
    var nav = document.getElementById('langbar'); nav.textContent = '';
    nav.appendChild(document.createTextNode((data.language || 'Language') + ': '));
    supported.forEach(function (code, i) {
      if (i) nav.appendChild(document.createTextNode(' · '));
      var a = el('a', names[code]);
      a.href = location.pathname + '?lang=' + code.toLowerCase();
      a.setAttribute('aria-current', code === lang ? 'true' : 'false');
      a.addEventListener('click', function () { localStorage.setItem('notatrPolicyLang', code); localStorage.setItem('notatrSiteLang', code.toLowerCase()); });
      nav.appendChild(a);
    });
  }
  function loadLocale(code) {
    function loadScriptLocale() {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'locales/policy' + code + '.js';
        script.onload = function () {
          var bag = window.NOTATR_POLICY_LOCALES || {};
          if (bag[code]) resolve(bag[code]); else reject(new Error('script-locale'));
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    if (location.protocol === 'file:') return loadScriptLocale();
    return fetch('locales/policy' + code + '.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('locale'); return r.json();
    }).catch(loadScriptLocale);
  }
  loadLocale(lang).then(render).catch(function () {
    if (lang !== fallback) location.replace(location.pathname + '?lang=' + fallback.toLowerCase());
  });
}());
</script>
</body>
</html>
